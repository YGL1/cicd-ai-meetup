# אותו פייפליין ב-GitLab CI — להשוואה בלבד (לא רץ ב-GitHub)
stages:
  - lint
  - test

default:
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

lint:
  stage: lint
  script:
    - npm run lint

test:
  stage: test
  parallel:
    matrix:
      - NODE_IMAGE: ["node:22", "node:24"]
  image: $NODE_IMAGE
  script:
    - npm run test:ci
    - npm run coverage
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml
